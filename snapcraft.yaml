name: cursor-theme-oxygen
build-base: core24
base: bare
version: "6.8.2"
platforms:
  all:
    build-on: [amd64]
    build-for: [all]
summary: Oxygen cursors
description: |
  A Snap that allows you to use Oxygen cursors in Snap apps
grade: stable
confinement: strict
compression: lzo

slots:
  icon-themes:
    interface: content
    source:
      read:
        - $SNAP/share/icons/KDE_Classic
        - $SNAP/share/icons/Oxygen_Black
        - $SNAP/share/icons/Oxygen_Blue
        - $SNAP/share/icons/Oxygen_White
        - $SNAP/share/icons/Oxygen_Yellow
        - $SNAP/share/icons/Oxygen_Zion


parts:
  oxygen-cursors:
    plugin: cmake
    source: https://invent.kde.org/plasma/oxygen.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-subdir: cursors
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DKDE_INSTALL_ICONDIR=/share/icons
    override-build: |
      craftctl default
      craftctl set version=$(date +%Y-%m-%d)
    prime:
      - share/icons/
